name: Error
description: Algo no funciona.
title: "[Error] "
labels: ["error"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrí el simulador en...
        2. Moví...
        3. Pasó...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: iPad 9.ª gen, Safari / Laptop Linux Mint, Firefox
    validations:
      required: true
